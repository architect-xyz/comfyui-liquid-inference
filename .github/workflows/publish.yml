name: Publish to the Comfy Registry

# Each v* tag publishes that version to the Comfy Registry and makes a GitHub
# release. A Registry version cannot be changed or deleted.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'architect-xyz/comfyui-liquid-inference'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the tag is the version in pyproject.toml
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
      - uses: Comfy-Org/publish-node-action@7578cdb0c1410f2515e6f9b1443c6859cab94f05 # 1.0.1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: "true"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
